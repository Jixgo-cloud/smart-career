name: Verify SmartCareer Monorepo

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run lint
      - run: npm run test:domain
