<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    
    <linearGradient id="c1-lock-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="c1-lock-light-glow" cx="68%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#1D7AFC" stop-opacity="0.48" />
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c1-lock-light-arrow" x1="15%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#1D7AFC" />
      <stop offset="50%" stop-color="#2584FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="c1-lock-light-bracket-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="c1-lock-light-bracket-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="c1-lock-light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.32" />
    </filter>
  
    <linearGradient id="c1-lock-light-word-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D7AFC" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
  .wordmark {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
</style>
  <rect x="0" y="0" width="1600" height="480" rx="32" fill="#FFFFFF" />

  <!-- Left Icon Badge -->
  <g transform="translate(72, 64)">
    <rect x="0" y="0" width="352" height="352" rx="84" fill="url(#c1-lock-light-bg)" />
    <rect x="0" y="0" width="352" height="352" rx="84" fill="url(#c1-lock-light-glow)" />
    <rect x="2" y="2" width="348" height="348" rx="82" fill="none" stroke="rgba(56,189,248,0.35)" stroke-width="4" />
    <g transform="translate(28, 28) scale(0.578)">
      
    <!-- Left Code Bracket < -->
    <path d="M 142 166 L 52 256 L 142 346"
      fill="none"
      stroke="url(#c1-lock-light-bracket-dark)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round" />

    <!-- Right Code Bracket > -->
    <path d="M 370 166 L 460 256 L 370 346"
      fill="none"
      stroke="url(#c1-lock-light-bracket-dark)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round" />

    <!-- Rising Career Arrow (Replaces '/' in </> with clean separation) -->
    <g filter="url(#c1-lock-light-shadow)">
      <path d="M 182 372 L 326 140"
        fill="none"
        stroke="url(#c1-lock-light-arrow)"
        stroke-width="46"
        stroke-linecap="round" />
      <path d="M 226 134 L 332 134 L 332 240"
        fill="none"
        stroke="url(#c1-lock-light-arrow)"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </g>

    <!-- Origin Skill Node on Arrow Base -->
    <circle cx="182" cy="372" r="16" fill="#00F0FF" stroke="#0B132B" stroke-width="8" />

    <!-- AI Spark at Top Left -->
    <path d="M 184 106 Q 184 132 210 132 Q 184 132 184 158 Q 184 132 158 132 Q 184 132 184 106 Z"
      fill="#38BDF8" />
  
    </g>
  </g>

  <!-- Right Brand Typography -->
  <g transform="translate(472, 0)">
    <!-- Wordmark: Smart + Career -->
    <text x="0" y="242" class="wordmark" font-size="152" fill="#0F172A">
      Smart<tspan fill="url(#c1-lock-light-word-grad)">Career</tspan>
    </text>

    <!-- Subtitle Pill + Tagline -->
    <rect x="4" y="288" width="164" height="48" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
    <text x="86" y="319" text-anchor="middle" class="tagline" font-size="21" fill="#1D7AFC">VERIFIED</text>
    <text x="192" y="320" class="tagline" font-size="23" fill="#475569">SKILL ASSESSMENT &amp; JOB MATCHING</text>
  </g>
</svg>